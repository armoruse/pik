plugins {
    id "com.android.application"
}

// 可選的本地簽章檔只在開發者提供時套用，沒有簽章檔仍可建立 release APK。
def releaseSigningFile = rootProject.file("signing/keystore.properties")
def releaseSigning = new Properties()
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace "com.pikminx.helper"
    compileSdk 35

    // minSdk 30 對應目前無障礙截圖與懸浮窗流程的最低支援版本。
    defaultConfig {
        applicationId "com.pikminx.helper"
        minSdk 30
        targetSdk 35
        versionCode 201
        versionName "2.0.1"
        buildConfigField "boolean", "PLANTING_OCR_DIAGNOSTICS", "false"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (releaseSigningFile.exists()) {
                storeFile rootProject.file("signing/${releaseSigning.storeFile}")
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
        ocrTest {
            initWith release
            matchingFallbacks = ["release"]
            buildConfigField "boolean", "PLANTING_OCR_DIAGNOSTICS", "true"
        }
    }

    lint {
        // 保留原生 View 實作，停用與本專案無關的兩項提示。
        disable "AndroidGradlePluginVersion", "AppCompatCustomView"
        warningsAsErrors true
    }
}

dependencies {
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
    implementation "com.google.mlkit:text-recognition-devanagari:16.0.1"
    implementation "com.google.mlkit:text-recognition-japanese:16.0.1"
    implementation "com.google.mlkit:text-recognition-korean:16.0.1"
    testImplementation "junit:junit:4.13.2"
}
