plugins {
    id 'com.android.application' version '8.2.2' apply true
}

android {
    namespace 'com.pikminx.helper'
    compileSdk 34

    defaultConfig {
        applicationId "com.pikminx.helper"
        minSdk 30
        targetSdk 34
        versionCode 309
        versionName "3.0.9-skip2days"
        buildConfigField "boolean", "GEOMETRY_VALIDATION", "false"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "GEOMETRY_VALIDATION", "false"
        }
        debug {
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "GEOMETRY_VALIDATION", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            res.srcDirs = ['res']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Google ML Kit Text Recognition
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}